# HILS gateway: PLC (Modbus TCP) <-> VILLASnode <-> simulator (Python / MATLAB / Simulink, UDP)
#
# 설계 문서: docs/04_villasnode_design.md
# 상태: 초안. VILLASnode 소스(lib/nodes/modbus.cpp, etc/examples/nodes/*.conf) 기준으로 작성했고,
#       실제 villas-node 로 실행 검증하지 않았다.
#
# 실행:  villas-node villas/hils.conf
#        docker run --rm -it --net host -v $PWD/villas:/cfg registry.git.rwth-aachen.de/acs/public/villas/node \
#               node /cfg/hils.conf
#
# 레지스터 맵: float32 (IEEE 754, 레지스터 2개, word/byte big endian) = 물리량
#              정수 1 레지스터 (uint16) = 상태 코드, Sequence, heartbeat
# 모든 신호는 시뮬레이터 쪽에서 float64 로 주고받는다 (정수 레지스터도 type = "float",
# integer_registers = 1 로 읽어 실수로 변환 -> UDP 패킷이 float64 배열 하나로 단순해진다).

logging = {
    level = "info"
}

stats = 10.0                        # 10 s 마다 경로 통계(수신/송신/손실/지연) 출력

nodes = {
    # ------------------------------------------------------------------ PLC
    plc = {
        type = "modbus"
        transport = "tcp"
        remote = "192.168.0.10"     # PLC IP (가짜 PLC: 127.0.0.1)
        port = 502                  # 가짜 PLC 로 시험하려면 float32 맵 지원 추가 필요 (설계 문서 8절 1단계)
        unit = 1
        response_timeout = 0.5      # s. 1 s 주기 안에 실패를 감지
        rate = 1                    # Hz. PLC 읽기 주기 = 시뮬레이터 1 s 시간층의 기준 시계

        in = {                      # PLC -> 시뮬레이터 : 40001~40026 (26 registers, FC03 한 번)
            signals = (
                { name = "T_supply",      type = "float", address = 0,  word_endianess = "big", byte_endianess = "big", unit = "degC" },
                { name = "RH_supply",     type = "float", address = 2,  word_endianess = "big", byte_endianess = "big", unit = "%" },
                { name = "T_return",      type = "float", address = 4,  word_endianess = "big", byte_endianess = "big", unit = "degC" },
                { name = "RH_return",     type = "float", address = 6,  word_endianess = "big", byte_endianess = "big", unit = "%" },
                { name = "V_air",         type = "float", address = 8,  word_endianess = "big", byte_endianess = "big", unit = "m3/h" },
                { name = "P_atm",         type = "float", address = 10, word_endianess = "big", byte_endianess = "big", unit = "kPa" },
                { name = "T_chamber",     type = "float", address = 12, word_endianess = "big", byte_endianess = "big", unit = "degC" },
                { name = "RH_chamber",    type = "float", address = 14, word_endianess = "big", byte_endianess = "big", unit = "%" },
                { name = "T_outdoor",     type = "float", address = 16, word_endianess = "big", byte_endianess = "big", unit = "degC" },
                { name = "RH_outdoor",    type = "float", address = 18, word_endianess = "big", byte_endianess = "big", unit = "%" },
                { name = "P_HP",          type = "float", address = 20, word_endianess = "big", byte_endianess = "big", unit = "W" },
                { name = "HP_status",     type = "float", address = 22, integer_registers = 1 },
                { name = "AckSequence",   type = "float", address = 23, integer_registers = 1 },
                { name = "PLC_status",    type = "float", address = 24, integer_registers = 1 },
                { name = "PLC_heartbeat", type = "float", address = 25, integer_registers = 1 }
            )
        }

        out = {                     # 시뮬레이터 -> PLC : 40100~40110 (11 registers, FC16 한 번)
            signals = (
                { name = "T_room_SP",     type = "float", address = 99,  word_endianess = "big", byte_endianess = "big", unit = "degC" },
                { name = "RH_room_SP",    type = "float", address = 101, word_endianess = "big", byte_endianess = "big", unit = "%" },
                { name = "T_outdoor_SP",  type = "float", address = 103, word_endianess = "big", byte_endianess = "big", unit = "degC" },
                { name = "RH_outdoor_SP", type = "float", address = 105, word_endianess = "big", byte_endianess = "big", unit = "%" },
                { name = "Enable",        type = "float", address = 107, integer_registers = 1 },
                { name = "Sequence",      type = "float", address = 108, integer_registers = 1 },
                { name = "SIM_heartbeat", type = "float", address = 109, integer_registers = 1 }
            )
        }
    }

    # ------------------------------------------------------------ simulator
    sim = {
        type = "socket"
        layer = "udp"
        format = {
            type = "raw"
            bits = 64               # float64
            endianess = "big"       # network byte order
            fake = false            # 헤더 없이 신호 값만 (PLC->Sim 15 x 8 B = 120 B, Sim->PLC 7 x 8 B = 56 B)
        }

        in = {                      # 시뮬레이터 -> VILLASnode (시뮬레이터가 12001 로 송신)
            address = "0.0.0.0:12001"
            signals = (
                { name = "T_room_SP",     type = "float" },
                { name = "RH_room_SP",    type = "float" },
                { name = "T_outdoor_SP",  type = "float" },
                { name = "RH_outdoor_SP", type = "float" },
                { name = "Enable",        type = "float" },
                { name = "Sequence",      type = "float" },
                { name = "SIM_heartbeat", type = "float" }
            )
        }
        out = {                     # VILLASnode -> 시뮬레이터 (시뮬레이터가 12000 에서 수신)
            address = "127.0.0.1:12000"
        }
    }

    # ---------------------------------------------------------- 원시 기록
    log = {
        type = "file"
        uri = "logs/hils_%F_%T.csv"      # strftime 토큰 (예제 etc/examples/nodes/file.conf 와 같은 방식)
        format = "csv"
    }
}

paths = (
    {   # PLC 측정 -> 시뮬레이터 (+ 원시 기록)
        in = "plc"
        out = [ "sim", "log" ]
        hooks = (
            { type = "stats", verbose = false }
        )
    },
    {   # 시뮬레이터 명령 -> PLC. 샘플이 도착할 때마다 FC16 쓰기
        in = "sim"
        out = "plc"
        hooks = (
            # 설정값 이중 보호 (supervisor 의 setpoint 한계와 동일). 신호는 이름으로 지정
            { type = "limit_value", signal = "T_room_SP",  min = 10.0, max = 35.0 },
            { type = "limit_value", signal = "RH_room_SP", min = 15.0, max = 85.0 }
        )
    }
)
